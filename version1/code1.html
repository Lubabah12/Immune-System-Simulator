<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشروع محاكي الاستجابة المناعية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #080a0f; color: #f8fafc; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .glass-ui { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 12px; border-radius: 10px; background: rgba(255,255,255,0.1); outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #fff; border-radius: 50%; cursor: pointer; border: 4px solid #1e293b; }
    </style>
</head>
<body>

    <canvas id="immuneCanvas"></canvas>

    <!-- الإحصائيات الحيوية -->
    <div class="fixed top-6 left-0 w-full px-6 z-10 pointer-events-none">
        <div class="max-w-md mx-auto grid grid-cols-2 gap-4">
            <div class="glass-ui p-4 rounded-3xl text-center">
                <p class="text-[10px] text-red-400 font-bold mb-1">الحمل الفيروسي</p>
                <p id="virus-count" class="text-3xl font-black">0</p>
            </div>
            <div class="glass-ui p-4 rounded-3xl text-center">
                <p class="text-[10px] text-blue-400 font-bold mb-1">الخلايا المناعية</p>
                <p id="immune-count" class="text-3xl font-black">0</p>
            </div>
        </div>
        
        <!-- ملاحظات طبية تفاعلية -->
        <div id="status-card" class="max-w-md mx-auto mt-4 glass-ui p-4 rounded-3xl border-r-4 border-green-500 opacity-0 transition-all duration-500">
            <p id="status-note" class="text-xs leading-relaxed font-medium text-slate-200"></p>
        </div>
    </div>

    <!-- لوحة التحكم السفلية -->
    <div class="fixed bottom-0 left-0 w-full glass-ui rounded-t-[40px] p-8 z-20">
        <div class="max-w-md mx-auto space-y-6">
            
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-400">معدل التهديد (الفيروسات)</span>
                    <span id="v-val" class="text-lg font-bold text-red-500">0</span>
                </div>
                <input type="range" id="v-slider" min="0" max="100" value="10">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-400">قوة الاستجابة المناعية</span>
                    <span id="i-val" class="text-lg font-bold text-blue-500">20</span>
                </div>
                <input type="range" id="i-slider" min="5" max="100" value="20">
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2">
                <button id="reset-btn" class="bg-slate-800 py-4 rounded-2xl font-bold active:scale-95 transition-all">إعادة تهيئة</button>
                <button id="boost-btn" class="bg-blue-600 text-white py-4 rounded-2xl font-bold active:scale-95 transition-all shadow-lg shadow-blue-500/20">حقن أجسام مضادة 💉</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('immuneCanvas');
        const ctx = canvas.getContext('2d');
        const vSlider = document.getElementById('v-slider');
        const iSlider = document.getElementById('i-slider');
        const vValText = document.getElementById('v-val');
        const iValText = document.getElementById('i-val');
        const vCountText = document.getElementById('virus-count');
        const iCountText = document.getElementById('immune-count');
        const statusCard = document.getElementById('status-card');
        const statusNote = document.getElementById('status-note');

        let width, height, particles = [];
        let virusTarget = 10, immuneTarget = 20;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Cell {
            constructor(type, x, y) {
                this.type = type; // 'virus' or 'immune' or 'healthy'
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * (height * 0.6);
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = type === 'virus' ? 5 : 8;
                this.dead = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height * 0.65) this.vy *= -1;

                // مطاردة الخلايا المناعية للفيروسات
                if (this.type === 'immune') {
                    particles.forEach(p => {
                        if (p.type === 'virus') {
                            const d = Math.hypot(p.x - this.x, p.y - this.y);
                            if (d < 150) {
                                this.vx += (p.x - this.x) * 0.002;
                                this.vy += (p.y - this.y) * 0.002;
                            }
                        }
                    });
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                if (this.type === 'virus') {
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ef4444';
                } else {
                    ctx.fillStyle = '#3b82f6';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#3b82f6';
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            resize();
            particles = [];
            for(let i=0; i<immuneTarget; i++) particles.push(new Cell('immune'));
            for(let i=0; i<virusTarget; i++) particles.push(new Cell('virus'));
        }

        function checkCollisions() {
            for(let i=0; i<particles.length; i++) {
                for(let j=i+1; j<particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    if (p1.dead || p2.dead) continue;

                    const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (d < p1.radius + p2.radius + 2) {
                        if ((p1.type === 'immune' && p2.type === 'virus') || (p2.type === 'immune' && p1.type === 'virus')) {
                            const virus = p1.type === 'virus' ? p1 : p2;
                            virus.dead = true;
                        }
                    }
                }
            }
            particles = particles.filter(p => !p.dead);
        }

        function updateUI() {
            const vCount = particles.filter(p => p.type === 'virus').length;
            const iCount = particles.filter(p => p.type === 'immune').length;

            vCountText.innerText = vCount;
            iCountText.innerText = iCount;
            vValText.innerText = vSlider.value;
            iValText.innerText = iSlider.value;

            statusCard.style.opacity = "1";
            if (vCount > 80) {
                statusNote.innerHTML = "🔴 <b>حالة حرجة:</b> الحمل الفيروسي يتجاوز قدرة الجهاز المناعي. الفيروسات بدأت بالتضاعف الأسي (Exponential Growth).";
                statusCard.style.borderColor = "#ef4444";
            } else if (vCount > 0) {
                statusNote.innerHTML = "🟡 <b>معركة نشطة:</b> الجهاز المناعي يتعرف على الأجسام الغريبة ويقوم بتحييدها. ارفع مستوى المناعة للمساعدة.";
                statusCard.style.borderColor = "#f59e0b";
            } else {
                statusNote.innerHTML = "🟢 <b>نظام محمي:</b> تم القضاء على التهديدات الحيوية. الجسم في حالة استشفاء الآن.";
                statusCard.style.borderColor = "#10b981";
            }

            // التكاثر الفيروسي (كلما زاد عدد الفيروسات، تزداد سرعة تكاثرها)
            if (vCount > 0 && vCount < 150 && Math.random() < (vCount * 0.001)) {
                particles.push(new Cell('virus'));
            }
        }

        function loop() {
            ctx.fillStyle = 'rgba(8, 10, 15, 0.4)';
            ctx.fillRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            checkCollisions();
            updateUI();
            requestAnimationFrame(loop);
        }

        // تفاعلات السلايدر
        vSlider.oninput = () => {
            const val = parseInt(vSlider.value);
            const current = particles.filter(p => p.type === 'virus').length;
            if (val > current) {
                for(let i=0; i<val-current; i++) particles.push(new Cell('virus'));
            }
        };

        iSlider.oninput = () => {
            const val = parseInt(iSlider.value);
            const current = particles.filter(p => p.type === 'immune').length;
            if (val > current) {
                for(let i=0; i<val-current; i++) particles.push(new Cell('immune'));
            } else {
                let removed = 0;
                particles = particles.filter(p => {
                    if (p.type === 'immune' && removed < current - val) {
                        removed++; return false;
                    }
                    return true;
                });
            }
        };

        document.getElementById('boost-btn').onclick = () => {
            for(let i=0; i<30; i++) particles.push(new Cell('immune'));
        };

        document.getElementById('reset-btn').onclick = init;

        window.onresize = resize;
        init();
        loop();
    </script>
</body>
</html>
